# Runs the full pipeline offline on SYNTHETIC data for the FICTIONAL state 'Synthetica'.
# First: python scripts/make_synthetic_data.py
state: Synthetica
districts: []
subdistricts: []
start_date: "2019-01-01"
end_date: "2020-12-31"
variables: [rainfall, tmax, tmin]
source: IMD
output_dir: "./sample_output"
output_format: [NetCDF, GeoTIFF, CSV, GeoPackage]
boundary_source:
  path: "./sample_data/boundaries/synthetica_FICTIONAL.geojson"
  source_note: "Fictional test boundary generated by src/synthetic.py"
acquisition_mode: manual
manual_import_dir: "./sample_data/manual_downloads"
resume_download: true
validate_data: true
cell_selection: centre
